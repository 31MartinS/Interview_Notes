<section class="hero-spread editorial-grid-cream">
  <div class="hero-container">
    <!-- Left Column: Sole Main Title & Direct Index of the 3 Learnings -->
    <div class="hero-editorial-col">
      <h1 class="hero-headline">
        {{ i18n.t().hero.title }}
      </h1>

      <!-- Clean Index of the 3 Learnings -->
      <div class="hero-learnings-index">
        <button type="button" class="index-row-btn" (click)="onSelectPillar('connect')">
          <span class="index-num">01</span>
          <span class="index-label">{{ i18n.t().connect.title }}</span>
        </button>

        <button type="button" class="index-row-btn" (click)="onSelectPillar('open')">
          <span class="index-num">02</span>
          <span class="index-label">{{ i18n.t().open.title }}</span>
        </button>

        <button type="button" class="index-row-btn" (click)="onSelectPillar('empower')">
          <span class="index-num">03</span>
          <span class="index-label">{{ i18n.t().empower.title }}</span>
        </button>
      </div>

      <div class="hero-cta-group">
        <button type="button" class="cta-zine-btn" (click)="onStartClick()">
          <span class="cta-btn-text">{{ i18n.t().hero.ctaStart }}</span>
        </button>
      </div>
    </div>

    <!-- Right Column: Focused Editorial Collage Composition -->
    <div class="hero-collage-col">
      <div
        class="collage-stage"
        [style.transform]="'translate3d(' + parallaxX() * 0.35 + 'px, ' + parallaxY() * 0.35 + 'px, 0)'">

        <div class="collage-backdrop-card halftone-dots-orange"></div>
        <div class="collage-navy-frame"></div>

        <!-- Primary Cutout Photograph -->
        <figure class="collage-photo-main group">
          <div class="masking-tape-orange tape-photo-main"></div>
          <div class="photo-inner-wrap">
            <img
              src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=900&q=80"
              [alt]="i18n.t().hero.collageCaption1"
              class="photocopy-img photo-cover"
              loading="eager" />
            <div class="risograph-tint-overlay"></div>
          </div>
          <figcaption class="photo-caption">
            <span>{{ i18n.t().hero.collageCaption1 }}</span>
          </figcaption>
        </figure>

        <!-- Secondary Cutout Photograph -->
        <figure class="collage-photo-secondary group">
          <div class="masking-tape tape-photo-sec"></div>
          <div class="photo-inner-wrap">
            <img
              src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=650&q=80"
              [alt]="i18n.t().hero.collageCaption2"
              class="photocopy-img photo-cover"
              loading="eager" />
          </div>
          <figcaption class="photo-caption-dark">
            {{ i18n.t().hero.collageCaption2 }}
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>
